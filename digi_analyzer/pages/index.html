<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão D_A</title>
    <link rel="stylesheet" href="/digi_analyzer/css/index.css">
</head>
<body>
    <header>
        <img class="LogoDgm"  src="../../assets/images/logodigimon.png" alt="Logo do Cartão D_A">

        <form>
            <input type="text" placeholder="procure um digimon aqui...">
            <button type="submit">
                <img src="../../assets/svg/Lupa.png" alt="Lupa de pesquisa">
            </button>
        </form>
    </header>

    <nav>
        <button id="menu-btn">Geração</button>

        <div id="menu">
            <a href="#">Geração 1</a>
            <a href="#">Geração 2</a>
            <a href="#">Geração 3</a>
            <a href="#">Geração 4</a>
            <a href="#">Geração 5</a>
            <a href="#">Geração 6</a>
            <a href="#">Geração 7</a>
            <a href="#">Geração 8</a>
            <a href="#">Geração 9</a>
            <a href="https://www.pokemon.com/us/pokedex">Geração 10</a>
        </div>
    </nav>
    
    <main>
        <section class="Cards">
            <article class="Card">
                <div class="card-header">
                    <span>001</span> 
                    <h1>Alargado</h1>
                </div>

                <div class="card-details">
                    <h2>HP: 69 </h2>
                    <p>Tipo: Agua </p>
                    <button class="btn-details">Detalhes</button>
                </div>
            </article>

            <article class="Card">
                <div class="card-header">
                    <span>002</span> 
                    <h1>LindexPrexerex</h1>
                </div>

                <div class="card-details">
                    <h2>HP: 24 </h2>
                    <p>Tipo: Foguex </p>
                    <button class="btn-details">Detalhes</button>
                </div>
            </article>
        </section>
        
    </main>

    <footer>

    </footer>
    <script src="/digi_analyzer/js/index.js"></script>
</body>
</html>
