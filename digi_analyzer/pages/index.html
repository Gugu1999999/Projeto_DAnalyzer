<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão D_A</title>
    <link rel="stylesheet" href="/digi_analyzer/css/index.css">
</head>
<body>
    <div class="fixed-header">
        <header>
            <img class="LogoDgm"  src="../../assets/images/logodigimon.png" alt="Logo do Cartão D_A">

            <form>
                <input type="text" id="search-input" placeholder="procure um digimon aqui...">
                <button type="submit">
                    <img src="../../assets/svg/Lupa.png" alt="Lupa de pesquisa">
                </button>
            </form>
        </header>

        <nav>
            <button id="menu-btn">Geração</button>

            <div id="menu">
                <a href="#">Geração 1</a>
                <a href="#">Geração 2</a>
                <a href="#">Geração 3</a>
                <a href="#">Geração 4</a>
                <a href="#">Geração 5</a>
                <a href="#">Geração 6</a>
                <a href="#">Geração 7</a>
                <a href="#">Geração 8</a>
                <a href="#">Geração 9</a>
                <a href="https://www.pokemon.com/us/pokedex">Geração 10</a>
            </div>
        </nav>
    </div>
    
    <main>
        <section class="Cards">

    <article class="Card">

        <img class="card-image"
             src="../../assets/images/digimon.webp"
             alt="Alargado">

        <div class="card-info">

            <span class="card-number">#001</span>

            <h1>Alargado</h1>

            <div class="card-types">
                <span class="type">Inanalisável</span>
            </div>

        </div>

    </article>

    <article class="Card">

        <img class="card-image"
             src="../../assets/images/digimon.webp"
             alt="LindexPrexerex">

        <div class="card-info">

            <span class="card-number">#002</span>

            <h1>LindexPrexerex</h1>

            <div class="card-types">
                <span class="type">Homem-Deus</span>
            </div>

        </div>

    </article>

</section>
        
    </main>

    <footer>
        <a href="#">Terms of use</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Contact</a>
        <p>©2026 Digimon. ©1997 - 2026 Akiyoshi Hongo, Toei Animation. TM, ® Bandai.</p>
    </footer>
    <script src="/digi_analyzer/js/index.js"></script>
</body>
</html>
